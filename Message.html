<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06131a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="channels4profile.jpg">
    <title>CoderAzhaf | Messages</title>
    <link rel="icon" type="image/png" sizes="192x192" href="channels4profile.jpg">
    <script src="accounts.js"></script>
    <style>
        :root { --bg:#081119; --panel:rgba(10,22,30,.9); --line:rgba(255,255,255,.1); --text:#f4f1e8; --muted:#bfd0d8; --accent:#f2c35e; --good:#67d7a7; --bad:#ff8c7f; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; font-family:"Trebuchet MS",sans-serif; color:var(--text); background:linear-gradient(rgba(5,10,15,.76), rgba(5,10,15,.88)), url("assets/profile-bg.svg") center/cover no-repeat fixed; padding:20px; }
        .shell { width:min(1100px,100%); margin:0 auto; display:grid; gap:20px; }
        .panel { background:var(--panel); border:1px solid var(--line); border-radius:28px; box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(16px); padding:24px; }
        .eyebrow { margin:0 0 10px; color:var(--accent); text-transform:uppercase; letter-spacing:.14em; font-size:.78rem; }
        h1,h2 { margin-top:0; }
        h1 { font-family:Georgia,serif; font-size:clamp(2.4rem,5vw,4rem); }
        p { color:var(--muted); line-height:1.7; }
        .hero-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
        .hero-avatar { width:86px; height:86px; border-radius:24px; object-fit:cover; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); }
        .layout { display:grid; grid-template-columns:360px 1fr; gap:20px; }
        .compose-card { display:grid; gap:14px; }
        .recipient-preview { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:18px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
        .recipient-preview img { width:60px; height:60px; border-radius:18px; object-fit:cover; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); }
        .recipient-preview strong,.recipient-preview span { display:block; }
        .recipient-preview span { color:var(--muted); font-size:.92rem; }
        select, textarea, button, input { width:100%; font:inherit; }
        select, textarea, input[type="text"] { margin-bottom:12px; padding:12px 14px; border-radius:16px; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05); color:var(--text); }
        textarea { min-height:120px; resize:vertical; }
        button { min-height:46px; border:0; border-radius:999px; background:linear-gradient(135deg,var(--accent),#ffae42); color:#111; font-weight:bold; cursor:pointer; }
        .attachment-box { display:grid; gap:10px; }
        .attachment-box input[type="file"] { padding:10px; border-radius:16px; border:1px dashed rgba(255,255,255,.2); background:rgba(255,255,255,.04); color:var(--muted); }
        .attachment-preview { display:grid; gap:10px; }
        .attachment-pill { padding:10px 12px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:var(--muted); }
        .message-body { display:grid; gap:12px; }
        .message-text { white-space:pre-wrap; color:var(--text); }
        .message-text a { color:var(--accent); }
        .attachment-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
        .attachment-item { padding:10px; border-radius:16px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); }
        .attachment-item img, .attachment-item video { width:100%; border-radius:12px; background:#000; }
        .attachment-item a { color:var(--accent); text-decoration:none; word-break:break-all; }
        .context-preview { display:grid; gap:10px; margin-bottom:12px; }
        .context-quote { padding:10px 12px; border-radius:16px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); color:var(--muted); font-size:.92rem; }
        .lists { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .message-list { display:grid; gap:12px; }
        .message-card { padding:16px; border-radius:20px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); }
        .message-head { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
        .message-avatar { width:52px; height:52px; border-radius:16px; object-fit:cover; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04); }
        .message-card strong,.message-card span { display:block; }
        .message-actions { display:flex; gap:10px; margin-top:12px; }
        .message-actions button { min-height:40px; }
        .secondary { background:rgba(255,255,255,.08); color:var(--text); border:1px solid rgba(255,255,255,.12); }
        .back-link { display:inline-flex; align-items:center; justify-content:center; margin-top:8px; color:var(--text); text-decoration:none; min-height:44px; padding:0 16px; border-radius:999px; border:1px solid rgba(255,255,255,.12); }
        .hero-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
        .message.success,.message.error { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:1000; padding:10px 16px; border-radius:16px; }
        .success { background:rgba(103,215,167,.18); border:1px solid var(--good); }
        .error { background:rgba(255,140,127,.18); border:1px solid var(--bad); }
        .app-loader { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg, rgba(8,16,24,.98), rgba(4,10,14,.98)); transition:opacity .26s ease, visibility .26s ease; }
        .app-loader.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
        .app-loader-card { display:grid; justify-items:center; gap:14px; padding:24px 26px; border-radius:28px; border:1px solid rgba(255,255,255,.1); background:rgba(10,22,30,.84); box-shadow:0 24px 70px rgba(0,0,0,.35); }
        .app-loader-card img { width:104px; height:104px; border-radius:28px; object-fit:cover; }
        .app-loader-card span { color:var(--muted); }
        .locked-card { display:grid; gap:12px; padding:18px; border-radius:22px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); }
        .invite-card { display:grid; gap:10px; padding:14px; border-radius:18px; background:rgba(101,209,183,.1); border:1px solid rgba(101,209,183,.24); }
        .invite-meta { color:var(--muted); font-size:.92rem; line-height:1.6; }
        .count-badge { display:inline-flex; min-width:28px; min-height:28px; align-items:center; justify-content:center; padding:0 10px; border-radius:999px; background:rgba(242,195,94,.14); border:1px solid rgba(242,195,94,.3); color:var(--accent); font-size:.88rem; margin-left:8px; }
        @media (max-width:860px) { .layout,.lists{grid-template-columns:1fr;} }
    </style>
    <style>
      body {
        background-image: url("channels4profile.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }
    </style>
</head>
<body>
    <div id="appLoader" class="app-loader" aria-hidden="true">
        <div class="app-loader-card">
            <img src="channels4profile.jpg" alt="AZHA Launchpad loading icon">
            <strong>AZHA Launchpad</strong>
            <span>Loading messages...</span>
        </div>
    </div>
    <main class="shell">
        <section class="panel">
            <div class="hero-row">
                <img id="currentUserAvatar" class="hero-avatar" src="channels4profile.jpg" alt="Current user profile picture">
                <div>
                    <p class="eyebrow">Messaging</p>
                    <h1>Inbox and sent messages</h1>
                </div>
            </div>
            <p id="statusText">Checking your account and backend connection.</p>
            <div class="hero-actions">
                <button id="enableNotificationsBtn" type="button" class="secondary">Enable notifications</button>
            </div>
            <a class="back-link" href="index.html">Back to launchpad</a>
        </section>
        <section class="panel layout">
            <div>
                <h2>Compose</h2>
                <div class="compose-card">
                    <input id="searchRecipient" type="text" placeholder="Search username..." style="margin-bottom:12px;">
                    <select id="recipientSelect"></select>
                    <div id="recipientPreview" class="recipient-preview">
                        <img id="recipientAvatar" src="channels4profile.jpg" alt="Recipient profile picture">
                        <div>
                            <strong id="recipientName">No recipient selected</strong>
                            <span id="recipientMeta">Choose someone to preview their profile picture before sending.</span>
                        </div>
                    </div>
                </div>
                <div id="composeContext" class="context-preview"></div>
                <textarea id="messageInput" placeholder="Write your message here"></textarea>
                <div class="attachment-box">
                    <input id="messageMedia" type="file" accept="image/*,video/*" multiple>
                    <div id="attachmentPreview" class="attachment-preview"></div>
                </div>
                <button id="sendButton" type="button">Send message</button>
                </div>
                <div class="lists">
                <div>
                    <h2>Inbox <span id="inboxUnreadBadge" class="count-badge">0</span></h2>
                    <div id="inboxList" class="message-list"></div>
                </div>
                <div>
                    <h2>Sent <span id="sentCountBadge" class="count-badge">0</span></h2>
                    <div id="sentList" class="message-list"></div>
                </div>
            </div>
        </section>
    </main>
    <script>
        const loaderStartedAt = Date.now();
        let userDirectory = [];
        let pendingAttachments = [];
        let currentUsername = '';
        let replyToMessage = null;
        let forwardedMessage = null;
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' }[char]));
        }
        function linkifyText(text) {
            const escaped = escapeHtml(text);
            return escaped.replace(/(https?:\/\/[^\s<]+)/gi, (match) => `<a href="${match}" target="_blank" rel="noreferrer">${match}</a>`);
        }
        function renderAttachmentNodes(attachments = []) {
            if (!attachments.length) return '';
            return `
                <div class="attachment-grid">
                    ${attachments.map((attachment) => {
                        if (attachment.type === 'image') {
                            return `<div class="attachment-item"><img src="${attachment.url}" alt="${escapeHtml(attachment.name)}"></div>`;
                        }
                        if (attachment.type === 'video') {
                            return `<div class="attachment-item"><video controls preload="metadata"><source src="${attachment.url}"></video></div>`;
                        }
                        return `<div class="attachment-item"><a href="${attachment.url}" target="_blank" rel="noreferrer">${escapeHtml(attachment.name)}</a></div>`;
                    }).join('')}
                </div>
            `;
        }
        function renderInviteCard(message) {
            const roomCode = message.meta?.roomCode || '';
            const title = message.meta?.title || 'AZHA Meeting';
            const startsAt = message.meta?.startsAt ? new Date(message.meta.startsAt).toLocaleString() : 'Start time not set';
            const note = message.meta?.note || message.text || 'Open the meeting invite to join.';
            return `
                <div class="invite-card">
                    <strong>${escapeHtml(title)}</strong>
                    <div class="invite-meta">
                        Host: @${escapeHtml(message.meta?.host || message.from)}<br>
                        Room code: ${escapeHtml(roomCode)}<br>
                        Starts: ${escapeHtml(startsAt)}
                    </div>
                    <div class="message-text">${linkifyText(note)}</div>
                    <div class="message-actions">
                        <button type="button" onclick="acceptInvite('${escapeHtml(message.id)}','${escapeHtml(roomCode)}')">Accept</button>
                        <button type="button" class="secondary" onclick="declineInvite('${escapeHtml(message.id)}')">Decline</button>
                        <button type="button" class="secondary" onclick="openInviteFocus('${escapeHtml(roomCode)}')">Open full screen</button>
                    </div>
                </div>
            `;
        }
        function renderPendingAttachments() {
            const preview = document.getElementById('attachmentPreview');
            if (!pendingAttachments.length) {
                preview.innerHTML = '';
                return;
            }
            preview.innerHTML = pendingAttachments.map((attachment, index) => `
                <div class="attachment-pill">
                    <strong>${escapeHtml(attachment.name)}</strong>
                    <div>${attachment.type}</div>
                    <button type="button" class="secondary" onclick="removePendingAttachment(${index})">Remove</button>
                </div>
            `).join('');
        }
        function renderComposeContext() {
            const wrapper = document.getElementById('composeContext');
            const blocks = [];
            if (replyToMessage) {
                blocks.push(`
                    <div class="context-quote">
                        <strong>Replying to @${escapeHtml(replyToMessage.from)}</strong><br>
                        ${escapeHtml(replyToMessage.text || '')}
                    </div>
                `);
            }
            if (forwardedMessage) {
                blocks.push(`
                    <div class="context-quote">
                        <strong>Forwarding from @${escapeHtml(forwardedMessage.from)}</strong><br>
                        ${escapeHtml(forwardedMessage.text || '')}
                    </div>
                `);
            }
            if (blocks.length) {
                blocks.push(`<button type="button" class="secondary" onclick="clearComposerContext()">Clear reply/forward</button>`);
            }
            wrapper.innerHTML = blocks.join('');
        }
        async function handleAttachmentInput(event) {
            const files = Array.from(event.target.files || []).slice(0, 4);
            pendingAttachments = [];
            for (const file of files) {
                const url = await readFileAsDataUrl(file);
                pendingAttachments.push({
                    type: file.type.startsWith('video/') ? 'video' : 'image',
                    name: file.name,
                    url
                });
            }
            renderPendingAttachments();
        }
        function removePendingAttachment(index) {
            pendingAttachments.splice(index, 1);
            renderPendingAttachments();
        }
        function avatarFor(username) {
            const user = userDirectory.find((entry) => entry.username === username);
            return user?.profilePic || 'azha-logo.png';
        }
        function updateRecipientPreview() {
            const recipient = document.getElementById('recipientSelect').value;
            const user = userDirectory.find((entry) => entry.username === recipient);
            document.getElementById('recipientAvatar').src = user?.profilePic || 'azha-logo.png';
            document.getElementById('recipientName').textContent = user?.fullName || recipient || 'No recipient selected';
            document.getElementById('recipientMeta').textContent = user ? `Message will go to @${user.username}` : 'Choose someone to preview their profile picture before sending.';
        }
        async function loadRecipients(currentUsername) {
            try {
                userDirectory = await getAllUsers();
                const currentUser = userDirectory.find((user) => user.username === currentUsername);
                if (currentUser?.profilePic) {
                    document.getElementById('currentUserAvatar').src = currentUser.profilePic;
                }
                populateRecipientSelect();
                updateRecipientPreview();
            } catch (error) {
                document.getElementById('recipientSelect').innerHTML = '<option value="">No users available</option>';
                updateRecipientPreview();
            }
        }

        function populateRecipientSelect(searchTerm = '') {
            const currentUsername = localStorage.getItem('currentUsername');
            const select = document.getElementById('recipientSelect');
            const filtered = userDirectory
                .filter((user) => user.username !== currentUsername && user.username.toLowerCase().includes(searchTerm.toLowerCase()))
                .map((user) => `<option value="${user.username}">${user.username}</option>`)
                .join('');
            select.innerHTML = filtered || '<option value="">No matching users</option>';
        }

        document.getElementById('searchRecipient').addEventListener('input', (e) => {
            populateRecipientSelect(e.target.value);
            updateRecipientPreview();
        });
        function renderMessageCard(message, currentUsername, type) {
            const actionButtons = [];
            if (type === 'inbox' && !message.read) actionButtons.push(`<button type="button" onclick="markRead('${message.id}')">Mark read</button>`);
            actionButtons.push(`<button type="button" class="secondary" onclick="replyMessage('${message.id}','${type}')">Reply</button>`);
            actionButtons.push(`<button type="button" class="secondary" onclick="forwardMessage('${message.id}','${type}')">Forward</button>`);
            actionButtons.push(`<button type="button" class="secondary" onclick="removeMessage('${message.id}')">Delete</button>`);
            const identity = type === 'inbox' ? message.from : message.to;
            const messageBody = message.kind === 'meeting-invite'
                ? renderInviteCard(message)
                : `
                    ${message.meta?.replyTo ? `<div class="context-quote"><strong>Reply to @${escapeHtml(message.meta.replyTo.from)}</strong><br>${escapeHtml(message.meta.replyTo.text || '')}</div>` : ''}
                    ${message.meta?.forwardedFrom ? `<div class="context-quote"><strong>Forwarded from @${escapeHtml(message.meta.forwardedFrom.from)}</strong><br>${escapeHtml(message.meta.forwardedFrom.text || '')}</div>` : ''}
                    ${message.text ? `<div class="message-text">${linkifyText(message.text)}</div>` : ''}
                    ${renderAttachmentNodes(message.attachments || [])}
                `;
            return `
                <article class="message-card">
                    <div class="message-head">
                        <img class="message-avatar" src="${avatarFor(identity)}" alt="${identity} profile picture">
                        <div>
                            <strong>${type === 'inbox' ? `From: ${message.from}` : `To: ${message.to}`}</strong>
                            <span>${new Date(message.timestamp).toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="message-body">
                        ${messageBody}
                    </div>
                    <div class="message-actions">${actionButtons.join('')}</div>
                </article>
            `;
        }
        async function refreshMessages(preloadedInbox = null) {
            const inboxSource = Array.isArray(preloadedInbox) ? preloadedInbox : await getInbox(currentUsername);
            const inbox = inboxSource.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
            const sent = (await getSent(currentUsername)).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
            const unreadCount = inbox.filter((message) => !message.read).length;
            document.getElementById('inboxList').innerHTML = inbox.length ? inbox.map((message)=>renderMessageCard(message,currentUsername,'inbox')).join('') : '<p>No inbox messages yet.</p>';
            document.getElementById('sentList').innerHTML = sent.length ? sent.map((message)=>renderMessageCard(message,currentUsername,'sent')).join('') : '<p>No sent messages yet.</p>';
            document.getElementById('inboxUnreadBadge').textContent = unreadCount;
            document.getElementById('sentCountBadge').textContent = sent.length;
            document.getElementById('statusText').textContent = `Signed in as ${currentUsername}. ${unreadCount} unread message${unreadCount === 1 ? '' : 's'} and live refresh is active.`;
        }
        async function markRead(id) { if (await markMessageRead(id,currentUsername)) refreshMessages(); }
        async function removeMessage(id) { if (await deleteMessage(id,currentUsername)) refreshMessages(); }
        async function replyMessage(id, type) {
            const source = type === 'inbox' ? await getInbox(currentUsername) : await getSent(currentUsername);
            const match = source.find((message) => message.id === id);
            if (!match) return;
            replyToMessage = { id: match.id, from: match.from, text: match.text || '' };
            forwardedMessage = null;
            document.getElementById('recipientSelect').value = type === 'inbox' ? match.from : match.to;
            updateRecipientPreview();
            renderComposeContext();
            document.getElementById('messageInput').focus();
        }
        async function forwardMessage(id, type) {
            const source = type === 'inbox' ? await getInbox(currentUsername) : await getSent(currentUsername);
            const match = source.find((message) => message.id === id);
            if (!match) return;
            forwardedMessage = { id: match.id, from: match.from, to: match.to, text: match.text || '' };
            replyToMessage = null;
            renderComposeContext();
            document.getElementById('messageInput').focus();
        }
        function clearComposerContext() {
            replyToMessage = null;
            forwardedMessage = null;
            renderComposeContext();
        }
        function buildMeetingUrl(room, focused) {
            const params = new URLSearchParams({ meeting: room });
            if (focused) params.set('host', '0');
            return `Meetings.html?${params.toString()}`;
        }
        function joinInviteRoom(room) {
            if (!room) {
                showMessage('This invite is missing its room code.', false);
                return;
            }
            window.location.href = buildMeetingUrl(room, false);
        }
        async function acceptInvite(id, room) {
            await markMessageRead(id, currentUsername);
            if (typeof markNotificationAsRead === 'function') {
                markNotificationAsRead(currentUsername, id);
            }
            joinInviteRoom(room);
        }
        async function declineInvite(id) {
            const removed = await deleteMessage(id, currentUsername);
            if (removed && typeof clearNotificationItem === 'function') {
                clearNotificationItem(currentUsername, id);
            }
            if (removed) {
                showMessage('Invite declined.', true);
                refreshMessages();
            }
        }
        function openInviteFocus(room) {
            if (!room) {
                showMessage('This invite is missing its room code.', false);
                return;
            }
            window.open(buildMeetingUrl(room, false), '_blank', 'noopener,noreferrer');
        }
        async function enableNotifications() {
            const permission = await requestNotificationAccess();
            if (permission === 'granted') {
                showMessage('Notifications are enabled on this device.', true);
            } else if (permission === 'denied') {
                showMessage('Notifications are blocked in this browser right now.', false);
            } else {
                showMessage('Notifications are not supported here.', false);
            }
        }
        document.getElementById('sendButton').addEventListener('click', async () => {
            const recipient = document.getElementById('recipientSelect').value;
            const text = document.getElementById('messageInput').value.trim();
            if (!recipient || (!text && !pendingAttachments.length)) { showMessage('Choose a recipient and add text or media.', false); return; }
            const ok = await sendMessage(currentUsername, recipient, text, pendingAttachments, {
                meta: {
                    replyTo: replyToMessage,
                    forwardedFrom: forwardedMessage
                }
            });
            if (ok) {
                document.getElementById('messageInput').value = '';
                document.getElementById('messageMedia').value = '';
                pendingAttachments = [];
                renderPendingAttachments();
                clearComposerContext();
                showMessage('Message sent.', true);
                refreshMessages();
            }
        });
        document.getElementById('recipientSelect').addEventListener('change', updateRecipientPreview);
        document.getElementById('messageMedia').addEventListener('change', handleAttachmentInput);
        document.getElementById('enableNotificationsBtn').addEventListener('click', enableNotifications);
        async function init() {
            // Add a small delay to ensure localStorage is synced after login
            await new Promise(resolve => setTimeout(resolve, 100));
            
            if (!checkLogin()) return;
            currentUsername = localStorage.getItem('currentUsername') || '';
            renderComposeContext();
            const access = await ensureFeatureAccess('messages', { silent: true });
            if (!access.allowed) {
                document.getElementById('statusText').textContent = `Signed in as ${currentUsername}. Messages are locked for your current membership.`;
                document.querySelector('.layout').innerHTML = `
                    <div class="locked-card">
                        <h2>Messages are locked</h2>
                        <p>Upgrade to <strong>Pro</strong> or <strong>MAX</strong> in your profile to unlock inbox and sending tools.</p>
                        <a class="back-link" href="Profile.html">Open membership</a>
                    </div>
                `;
                return;
            }
            const backend = await hasBackend();
            document.getElementById('statusText').textContent = backend ? `Signed in as ${currentUsername}. Messages refresh automatically and new ones should appear on this device in a few seconds.` : `Signed in as ${currentUsername}. Backend is unavailable, so local fallback mode is active.`;
            await loadRecipients(currentUsername);
            await refreshMessages();
            await startInboxPolling({
                username: currentUsername,
                intervalMs: 1500,
                onInbox: async (inbox) => {
                    await refreshMessages(inbox);
                }
            });
        }
        let messageWebSocket = null;

        async function connectWebSocketMessages() {
            return new Promise((resolve) => {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}`;
                
                try {
                    messageWebSocket = new WebSocket(wsUrl);
                    
                    messageWebSocket.onopen = () => {
                        const username = localStorage.getItem('currentUsername');
                        if (username) {
                            messageWebSocket.send(JSON.stringify({
                                type: 'register-user',
                                username: username
                            }));
                            console.log('WebSocket message connection established for:', username);
                        }
                        resolve();
                    };
                    
                    messageWebSocket.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);
                            
                            if (message.type === 'chat-message-received') {
                                // Message arrived from a friend
                                const from = message.from;
                                
                                // Show browser notification
                                if (Notification.permission === 'granted') {
                                    new Notification('New Message', {
                                        body: `${from}: ${message.text.substring(0, 50)}${message.text.length > 50 ? '...' : ''}`,
                                        icon: 'channels4profile.jpg'
                                    });
                                }
                                
                                // Refresh messages to show the new one
                                refreshMessages();
                            }
                        } catch (error) {
                            console.error('Error processing WebSocket message:', error);
                        }
                    };
                    
                    messageWebSocket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        resolve();
                    };
                    
                    messageWebSocket.onclose = () => {
                        console.log('WebSocket message connection closed');
                        // Attempt to reconnect after 3 seconds
                        setTimeout(() => {
                            if (currentUsername) connectWebSocketMessages();
                        }, 3000);
                    };
                } catch (error) {
                    console.error('Failed to connect WebSocket:', error);
                    resolve();
                }
            });
        }

        window.markRead = markRead;
        window.removeMessage = removeMessage;
        window.replyMessage = replyMessage;
        window.forwardMessage = forwardMessage;
        window.clearComposerContext = clearComposerContext;
        window.removePendingAttachment = removePendingAttachment;
            window.joinInviteRoom = joinInviteRoom;
        window.acceptInvite = acceptInvite;
        window.declineInvite = declineInvite;
        window.openInviteFocus = openInviteFocus;
        
        (async () => {
            await connectWebSocketMessages();
            init();
        })();
        window.addEventListener('load', () => {
            const loader = document.getElementById('appLoader');
            const elapsed = Date.now() - loaderStartedAt;
            const delay = Math.max(900 - elapsed, 0);
            window.setTimeout(() => {
                loader.classList.add('is-hidden');
                window.setTimeout(() => loader.remove(), 320);
            }, delay);
        });
